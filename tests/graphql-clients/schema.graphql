type Mutation {
  "Inserts rows into customers, all or none."
  insert_customers(rows: [customers_insert!]!): customers_insert_payload!
  "Inserts rows into customers, or updates those whose key is there already."
  save_customers(rows: [customers_insert!]!): customers_insert_payload_2!
  "Updates the rows of customers that match a condition (where, filter, or both); filter: \"true\" for every row."
  update_customers(
    "A condition as OData text: status eq 'open'; true for every row."
    filter: String,
    "Conditions the rows meet."
    where: customers_where,
    set: customers_set!): customers_rows_payload!
  "Updates a row of customers by its key or nodeId."
  update_customers_by_key(
    id: Int,
    "The row's global id, in place of its key."
    nodeId: ID,
    set: customers_set!): customers_row_payload!
  "Deletes the rows of customers that match a condition (where, filter, or both), returning them as they were; filter: \"true\" for every row."
  delete_customers(
    "A condition as OData text: status eq 'open'; true for every row."
    filter: String,
    "Conditions the rows meet."
    where: customers_where): customers_rows_payload_2!
  "Deletes a row of customers by its key or nodeId, returning it as it was."
  delete_customers_by_key(
    id: Int,
    "The row's global id, in place of its key."
    nodeId: ID): customers_row_payload_2!
  "Inserts rows into orders, all or none."
  insert_orders(rows: [orders_insert!]!): orders_insert_payload!
  "Inserts rows into orders, or updates those whose key is there already."
  save_orders(rows: [orders_insert!]!): orders_insert_payload_2!
  "Updates the rows of orders that match a condition (where, filter, or both); filter: \"true\" for every row."
  update_orders(
    "A condition as OData text: status eq 'open'; true for every row."
    filter: String,
    "Conditions the rows meet."
    where: orders_where,
    set: orders_set!): orders_rows_payload!
  "Updates a row of orders by its key or nodeId."
  update_orders_by_key(
    id: Int,
    "The row's global id, in place of its key."
    nodeId: ID,
    set: orders_set!): orders_row_payload!
  "Deletes the rows of orders that match a condition (where, filter, or both), returning them as they were; filter: \"true\" for every row."
  delete_orders(
    "A condition as OData text: status eq 'open'; true for every row."
    filter: String,
    "Conditions the rows meet."
    where: orders_where): orders_rows_payload_2!
  "Deletes a row of orders by its key or nodeId, returning it as it was."
  delete_orders_by_key(
    id: Int,
    "The row's global id, in place of its key."
    nodeId: ID): orders_row_payload_2!
  recalc_totals: [Any!]!
}

