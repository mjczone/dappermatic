"A row of customers."
type customers implements Node {
  "The row's global id."
  nodeId: ID!
  id: Int!
  name: String!
  country: String
  created: DateTime!
  ref: UUID
  photo: ByteArray
  prefs: Any
  points: Long!
  orders(
    "Conditions the rows meet."
    where: orders_where,
    "A condition as OData text, as the REST API takes it: status eq 'open'. ANDed with where."
    filter: String,
    "The order, each item naming one column or relation."
    orderBy: [orders_order_by!],
    "The most rows to read."
    first: Int,
    "The rows to skip."
    skip: Int): [orders!]!
}

